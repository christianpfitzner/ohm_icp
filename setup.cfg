[develop]
script_dir=$base/lib/ohm_icp
[install]
install_scripts=$base/lib/ohm_icp

[tool:pytest]
# A sourced ROS 2 brings pytest plugins that break collection; the same block as in ohm-odometry.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright
          -p no:ament_pep257 -p no:ament_xmllint -p no:ament_flake8
